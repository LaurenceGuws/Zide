plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.zide.androidbootstrap'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'dev.zide.androidbootstrap'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        // Keep app bytecode conservative while Gradle itself runs on the host JDK.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
